[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "policyimpact"
version = "0.1.0"
description = "Deterministic, evidence-grounded policy version impact proof of concept"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary assessment demonstration" }
authors = [{ name = "Jiuyi Zheng" }]
dependencies = [
  "pydantic>=2.7,<3",
  "streamlit>=1.41,<2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "pandas>=2.2,<3",
]
live = [
  "openai>=1.70,<3",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[project.scripts]
policyimpact = "policyimpact.cli:main"
